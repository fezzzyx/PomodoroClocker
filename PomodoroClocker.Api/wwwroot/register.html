<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Pomodoro Clocker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1><span class="logo-mark"></span> Pomodoro Clocker</h1>

            <h2>Create your account</h2>

            <form id="registerForm">

                <label>
                    Username

                    <input id="username"
                           type="text"
                           autocomplete="username"
                           required>
                </label>

                <label>
                    Password

                    <input id="password"
                           type="password"
                           autocomplete="new-password"
                           minlength="6"
                           required>
                </label>

                <label>
                    Confirm Password

                    <input id="confirmPassword"
                           type="password"
                           autocomplete="new-password"
                           minlength="6"
                           required>
                </label>

                <button type="submit"
                        class="primary-button">
                    Register
                </button>

            </form>

            <p id="registerError" class="auth-error"></p>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </main>

    <script src="js/register.js"></script>

</body>
</html>
